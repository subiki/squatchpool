name: Squatch release checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'but-wait.html'
      - 'caroms.html'
      - 'tuna.html'
      - 'arcade.html'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'assets/brand/**'
      - 'index.html'
      - 'cutthroat.html'
      - 'press-your-luck.html'
      - 'rules.html'
      - 'archive.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'app-icon-*.png'
      - '_headers'
      - 'scripts/**'
      - '.github/workflows/squatch-caroms-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node tests (capture diagnostic output)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-test-results.log
      - name: Syntax checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Read-only Cloudflare production art verification
        shell: bash
        run: |
          set -euo pipefail
          expected="104335a2ddd65413d70438f91c4f59eb918246da"
          site="https://squatch.subikistudios.com"
          echo "PUBLIC STATUS PROBE"
          for path in / /deployment.json /assets/brand/rock-hero-1600.webp /but-wait.html /api/stats; do
            code="$(curl -Ls --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$site$path?probe=$GITHUB_RUN_ID")"
            echo "Public $path => HTTP $code"
          done
          curl -sSI --connect-timeout 5 --max-time 12 "$site/deployment.json" | grep -Ei '^(HTTP/|server:|content-type:|cf-ray:|location:)' || true
          for attempt in $(seq 1 2); do
            echo "Production verification attempt $attempt/2"
            manifest="$(curl -fsSL --connect-timeout 5 --max-time 15 "$site/deployment.json?probe=$GITHUB_RUN_ID-$attempt" || true)"
            echo "Manifest: $manifest"
            if printf '%s' "$manifest" | jq -e --arg commit "$expected" '.commit == $commit and .branch == "main"' >/dev/null 2>&1; then
              echo "Live deployment manifest matches $expected"
              html="$(curl -fsSL --connect-timeout 5 --max-time 20 "$site/?probe=$GITHUB_RUN_ID")"
              grep -Fq 'rock-hero-wordmark' <<< "$html"
              for asset in rock-hero-1600.webp rock-wordmark.webp rock-but-wait-theres-more.webp rock-caroms.webp rock-cutthroat.webp rock-press-your-luck.webp rock-tuna.webp; do
                code="$(curl -Ls --connect-timeout 5 --max-time 20 -o /dev/null -w '%{http_code}' "$site/assets/brand/$asset?probe=$GITHUB_RUN_ID")"
                echo "Asset $asset: $code"
                test "$code" = 200
              done
              for page in but-wait.html caroms.html cutthroat.html press-your-luck.html tuna.html; do
                code="$(curl -Ls --connect-timeout 5 --max-time 20 -o /dev/null -w '%{http_code}' "$site/$page?probe=$GITHUB_RUN_ID")"
                echo "Game $page: $code"
                test "$code" = 200
              done
              echo "LIVE SQUATCH ROCK RELEASE VERIFIED $expected"
              exit 0
            fi
            sleep 2
          done
          echo "Production did not expose expected Cloudflare build within verification window." >&2
          exit 1
      - name: Browser smoke — one shared page across six routes
        env:
          SQUATCH_SCREENSHOT_DIR: ${{ runner.temp }}/squatch-game-layouts
        run: |
          node --check scripts/smoke-game-shell.mjs
          node scripts/smoke-game-shell.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squatch-game-layouts
          path: ${{ runner.temp }}/squatch-game-layouts/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve test failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caroms-node-test-results
          path: node-test-results.log
          if-no-files-found: warn
          retention-days: 7

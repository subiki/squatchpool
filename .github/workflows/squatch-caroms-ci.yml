name: Squatch release checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'but-wait.html'
      - 'caroms.html'
      - 'tuna.html'
      - 'arcade.html'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'assets/brand/**'
      - 'index.html'
      - 'cutthroat.html'
      - 'press-your-luck.html'
      - 'rules.html'
      - 'archive.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'app-icon-*.png'
      - '_headers'
      - 'scripts/**'
      - '.github/workflows/squatch-caroms-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validated build — syntax, UI contract, tests and offline edition
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee node-test-results.log
      - name: Browser smoke — one shared page across six routes
        env:
          SQUATCH_SCREENSHOT_DIR: ${{ runner.temp }}/squatch-game-layouts
        run: |
          node --check scripts/smoke-game-shell.mjs
          node scripts/smoke-game-shell.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squatch-game-layouts
          path: ${{ runner.temp }}/squatch-game-layouts/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve test failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caroms-node-test-results
          path: node-test-results.log
          if-no-files-found: warn
          retention-days: 7

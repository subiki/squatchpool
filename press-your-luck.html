<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Press Your Luck · Squatch Pool</title><style>:root{font-family:system-ui;color-scheme:dark;background:#11251d;color:#f7eed9}body{max-width:1100px;margin:auto;padding:18px}a{color:#f5cb80}canvas{display:block;width:100%;background:#165b47;border:10px solid #79583d;border-radius:14px;box-sizing:border-box;touch-action:none}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0;align-items:center}button,input,select{font:inherit;padding:10px}button{background:#efc77c;color:#19271e;border:0;border-radius:8px;font-weight:bold}label{display:grid;gap:5px}section{padding:12px;background:#233e31;border-radius:12px;margin:12px 0}</style></head><body><header><a href="./">← Squatch Pool</a><h1>🎲 Press Your Luck</h1><p>Clear your group, then pocket your opponent's balls for provisional points. Call the 8 to bank your rack; bank or kick the 8 to double it.</p></header><main><section class="controls"><label>Target score<input id="target" type="number" min="1" max="10000" value="15"></label><label>Table size<select id="size"><option value="7">7 ft</option><option value="8">8 ft</option><option value="9">9 ft</option></select></label><button id="start">New match</button><button id="next" hidden>Next rack</button></section><section><strong id="score">0 – 0</strong><p id="status">Ready to break.</p><p id="bonus">Provisional bonus: 0 – 0</p></section><canvas id="table" aria-label="Pool table. Tap to aim."></canvas><section class="controls"><label>Called ball<select id="call-ball"></select></label><label>Called pocket<select id="call-pocket"><option value="">Select pocket</option><option value="TL">Top left</option><option value="TM">Top middle</option><option value="TR">Top right</option><option value="BL">Bottom left</option><option value="BM">Bottom middle</option><option value="BR">Bottom right</option></select></label><label>Power<input id="power" type="range" min="5" max="100" value="65"></label><button id="shoot">Shoot</button><button id="place">Confirm cue placement</button><label><input type="checkbox" id="bank"> Called 8 is bank or kick</label><label><input type="checkbox" id="invert-aim"> Invert aim</label></section><section><h2>Rack history</h2><ol id="history"></ol><p id="notice" role="status"></p></section></main><script type="module" src="./src/press-your-luck-game.js"></script></body></html>
